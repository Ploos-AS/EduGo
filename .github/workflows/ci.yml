name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(find examples exercises solutions projects -type f -name '*.go' -print0 | xargs -0 -r gofmt -l)
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }

      - name: Vet all Go modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' mod; do
            dir=$(dirname "$mod")
            echo "==> vet: $dir"
            (cd "$dir" && go vet ./...)
          done < <(find examples exercises solutions projects -name go.mod -print0)

      - name: Test all Go modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' mod; do
            dir=$(dirname "$mod")
            echo "==> test: $dir"
            (cd "$dir" && go test ./...)
          done < <(find examples exercises solutions projects -name go.mod -print0)

      - name: Race detector
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' mod; do
            dir=$(dirname "$mod")
            echo "==> race: $dir"
            (cd "$dir" && go test -race ./...)
          done < <(find examples exercises solutions projects -name go.mod -print0)

      - name: Build student OCI
        run: docker build -t edugo-student:ci student-oci

      - name: Smoke test student OCI
        run: |
          docker run --rm edugo-student:ci go version
          docker run --rm edugo-student:ci bash -c 'tmp=$(mktemp -d); cd "$tmp"; printf "package main\nimport \"fmt\"\nfunc main(){fmt.Println(\"EduGo OCI OK\")}\n" > main.go; go run main.go | grep -Fx "EduGo OCI OK"'
