name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Format check
        run: |
          test -z "$(gofmt -l examples exercises solutions projects 2>/dev/null || true)"

      - name: Test all Go modules
        run: |
          set -eu
          find examples exercises solutions projects -name go.mod -print0 2>/dev/null |
          while IFS= read -r -d '' mod; do
            dir=$(dirname "$mod")
            echo "==> $dir"
            (cd "$dir" && go test ./...)
          done

      - name: Race detector
        run: |
          set -eu
          find examples exercises solutions projects -name go.mod -print0 2>/dev/null |
          while IFS= read -r -d '' mod; do
            dir=$(dirname "$mod")
            echo "==> race: $dir"
            (cd "$dir" && go test -race ./...)
          done

      - name: Build student OCI
        run: docker build -t edugo-student:ci student-oci
