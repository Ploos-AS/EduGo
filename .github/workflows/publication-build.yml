name: Publication build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - course/**
      - Makefile
      - build.yaml
      - publication.yml
      - .github/workflows/publication-build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex epubcheck
      - name: Build all publication formats
        run: |
          make web
          make epub-nb
          make epub-en
          make pdf-nb
          make pdf-en
      - name: Validate EPUBs
        run: |
          epubcheck dist/EduGo-nb.epub
          epubcheck dist/EduGo-en.epub
      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: edugo-publication
          if-no-files-found: error
          path: |
            dist/web/
            dist/*.epub
            dist/*.pdf
